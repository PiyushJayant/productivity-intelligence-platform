sources:
  alloydb-productivity:
    kind: alloydb-postgres
    project: ${GOOGLE_CLOUD_PROJECT}
    region: ${ALLOYDB_REGION}
    cluster: ${ALLOYDB_CLUSTER}
    instance: ${ALLOYDB_INSTANCE}
    ipType: ${ALLOYDB_IP_TYPE}
    database: ${ALLOYDB_DATABASE}
    user: ${ALLOYDB_USER}
    password: ${ALLOYDB_PASSWORD}

tools:

  # ── Task Tools ────────────────────────────────────────────────────────────────

  create_task:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Create a task only after all required values are known. Provide a
      nonblank title, optional description, priority (low/medium/high), and an
      optional resolved ISO due date or RFC 3339 deadline. When a user supplied
      a time, due_at must preserve it instead of silently dropping it. Returns
      normalized task metadata in ${DEFAULT_TIMEZONE}.
    parameters:
      - name: title
        type: string
        description: "Nonblank task title, for example: Submit monthly report"
      - name: description
        type: string
        description: Detailed description, or an empty string when omitted
      - name: priority
        type: string
        description: Priority level — must be low, medium, or high
      - name: due_date
        type: string
        description: "Resolved due date such as 2026-07-31, or an empty string"
      - name: due_at
        type: string
        description: "Resolved UTC RFC 3339 deadline, or an empty string when no time was requested"
    statement: >
      WITH created AS (
        INSERT INTO tasks (title, description, priority, due_date, due_at)
        VALUES (
          $1, $2, $3,
          COALESCE(
            NULLIF($4, '')::date,
            (NULLIF($5, '')::timestamptz AT TIME ZONE '${DEFAULT_TIMEZONE}')::date
          ),
          NULLIF($5, '')::timestamptz
        )
        RETURNING id, title, priority, status, due_date, due_at
      )
      SELECT id, title, priority, status,
        due_date::text AS due_date,
        CASE WHEN due_at IS NULL THEN NULL ELSE
          to_char(due_at AT TIME ZONE '${DEFAULT_TIMEZONE}', 'YYYY-MM-DD HH24:MI')
        END AS due_at_local,
        '${DEFAULT_TIMEZONE}' AS due_timezone
      FROM created;

  list_tasks:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      List tasks from the database. Pass a specific status to filter
      (pending, in_progress, done), or pass 'all' for recent tasks. Returns at
      most ${DEFAULT_PAGE_SIZE} records for user-friendly presentation.
    parameters:
      - name: status
        type: string
        description: "Filter by task status: pending, in_progress, done, or all"
    statement: >
      SELECT id, title, description, priority, status,
        due_date::text AS due_date,
        CASE WHEN due_at IS NULL THEN NULL ELSE
          to_char(due_at AT TIME ZONE '${DEFAULT_TIMEZONE}', 'YYYY-MM-DD HH24:MI')
        END AS due_at_local,
        '${DEFAULT_TIMEZONE}' AS due_timezone,
        created_at
      FROM tasks
      WHERE $1 = 'all' OR status = $1
      ORDER BY created_at DESC
      LIMIT ${DEFAULT_PAGE_SIZE};

  update_task_status:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Update one task to pending, in_progress, or done. Returns no row when the
      ID does not exist; report that outcome instead of claiming success.
    parameters:
      - name: task_id
        type: integer
        description: ID of the task to update
      - name: status
        type: string
        description: "New status value: pending, in_progress, or done"
    statement: >
      UPDATE tasks
      SET status = $2
      WHERE id = $1
      RETURNING id, title, status;

  delete_task:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Permanently delete one task by ID. Call only after the user explicitly
      confirms that exact task ID. Returns no row when the ID does not exist.
    parameters:
      - name: task_id
        type: integer
        description: ID of the task to delete
    statement: >
      DELETE FROM tasks
      WHERE id = $1
      RETURNING id, title;

  # ── Notes Tools ───────────────────────────────────────────────────────────────

  create_note:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Create a new note. The note embedding is automatically generated by
      AlloyDB AI using the configured ${EMBEDDING_MODEL} model, enabling
      semantic search. Returns the created note metadata.
    parameters:
      - name: title
        type: string
        description: "Nonblank note title, for example: Access review ideas"
      - name: content
        type: string
        description: Full text content of the note
      - name: tags
        type: string
        description: Comma-separated tags, or empty string if none
    statement: >
      INSERT INTO notes (title, content, tags, embedding)
      VALUES (
        $1, $2, $3,
        google_ml.embedding('${EMBEDDING_MODEL}', $1 || ' ' || $2)::vector
      )
      RETURNING id, title, LEFT(content, 180) AS content_preview,
        CASE WHEN tags = '' THEN 'No tags' ELSE tags END AS tags;

  search_notes_semantic:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Search notes using AlloyDB AI semantic vector similarity. Use for
      conceptual queries, not tag filtering. Returns up to 5 relevant notes
      with a cosine relevance score.
    parameters:
      - name: query
        type: string
        description: Natural language search query
    statement: >
      WITH ranked AS (
        SELECT id, title, content, tags, created_at,
          1 - (embedding <=> google_ml.embedding('${EMBEDDING_MODEL}', $1)::vector)
            AS relevance_score
        FROM notes
        WHERE embedding IS NOT NULL
      )
      SELECT id, title, content, tags, created_at,
        ROUND(relevance_score::numeric, 3) AS relevance_score
      FROM ranked
      WHERE relevance_score >= 0.50
      ORDER BY relevance_score DESC
      LIMIT 5;

  list_notes:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      List recent notes, optionally filtered by a tag. Pass an empty string for
      all tags. Returns at most ${DEFAULT_PAGE_SIZE} records.
    parameters:
      - name: tag
        type: string
        description: Tag to filter by, or empty string for all notes
    statement: >
      SELECT id, title, content, tags, created_at
      FROM notes
      WHERE $1 = '' OR tags ILIKE '%' || $1 || '%'
      ORDER BY created_at DESC
      LIMIT ${DEFAULT_PAGE_SIZE};

  delete_note:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Permanently delete one note by ID. Call only after the user explicitly
      confirms that exact note ID. Returns no row when the ID does not exist.
    parameters:
      - name: note_id
        type: integer
        description: ID of the note to delete
    statement: >
      DELETE FROM notes
      WHERE id = $1
      RETURNING id, title;

  # ── Calendar Tools ────────────────────────────────────────────────────────────

  create_event:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Create a calendar event after relative dates have been resolved. Requires
      a nonblank title, ISO date, 24-hour start time, and positive duration.
    parameters:
      - name: title
        type: string
        description: Title of the event
      - name: date
        type: string
        description: "Resolved ISO event date, for example 2026-07-24"
      - name: time
        type: string
        description: "Start time in HH:MM 24-hour format, for example 16:00"
      - name: duration_minutes
        type: integer
        description: Duration of the event in minutes (default 60)
      - name: description
        type: string
        description: Optional description or agenda for the event
    statement: >
      WITH created AS (
        INSERT INTO events (title, date, time, duration_minutes, description)
        VALUES ($1, $2::date, $3::time, $4, $5)
        RETURNING id, title, date, time, duration_minutes
      )
      SELECT id, title, date::text AS date,
        to_char(time, 'HH24:MI') AS time, duration_minutes
      FROM created;

  list_events:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      List calendar events. Filter by a specific date (YYYY-MM-DD),
      or pass an empty string to list events chronologically. Returns at most
      ${DEFAULT_PAGE_SIZE} records.
    parameters:
      - name: date
        type: string
        description: Date to filter by in YYYY-MM-DD format, or empty string for all events
    statement: >
      SELECT id, title, date::text AS date,
        to_char(time, 'HH24:MI') AS time,
        duration_minutes, description, created_at
      FROM events
      WHERE NULLIF($1, '') IS NULL OR date = NULLIF($1, '')::date
      ORDER BY date ASC, time ASC
      LIMIT ${DEFAULT_PAGE_SIZE};

  delete_event:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Permanently delete one event by ID. Call only after the user explicitly
      confirms that exact event ID. Returns no row when the ID does not exist.
    parameters:
      - name: event_id
        type: integer
        description: ID of the event to delete
    statement: >
      DELETE FROM events
      WHERE id = $1
      RETURNING id, title;

toolsets:
  task-tools:
    - create_task
    - list_tasks
    - update_task_status
    - delete_task

  notes-tools:
    - create_note
    - search_notes_semantic
    - list_notes
    - delete_note

  calendar-tools:
    - create_event
    - list_events
    - delete_event
