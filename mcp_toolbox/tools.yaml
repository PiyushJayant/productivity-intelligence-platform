sources:
  alloydb-productivity:
    kind: alloydb-postgres
    project: ${GOOGLE_CLOUD_PROJECT}
    region: ${ALLOYDB_REGION}
    cluster: ${ALLOYDB_CLUSTER}
    instance: ${ALLOYDB_INSTANCE}
    ipType: ${ALLOYDB_IP_TYPE}
    database: ${ALLOYDB_DATABASE}
    user: ${ALLOYDB_USER}
    password: ${ALLOYDB_PASSWORD}

tools:

  # ── Task Tools ────────────────────────────────────────────────────────────────

  create_task:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Create a task only after all required values are known. Provide a
      nonblank title, optional description, priority (low/medium/high), and an
      optional resolved ISO due date or RFC 3339 deadline. When a user supplied
      a time, due_at must preserve it instead of silently dropping it. Returns
      normalized task metadata in ${DEFAULT_TIMEZONE}.
    parameters:
      - name: title
        type: string
        description: "Nonblank task title, for example: Submit monthly report"
      - name: description
        type: string
        description: Detailed description, or an empty string when omitted
      - name: priority
        type: string
        description: Priority level — must be low, medium, or high
      - name: due_date
        type: string
        description: "Resolved due date such as 2026-07-31, or an empty string"
      - name: due_at
        type: string
        description: "Resolved UTC RFC 3339 deadline, or an empty string when no time was requested"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      WITH created AS (
        INSERT INTO tasks (
          title, description, priority, due_date, due_at, tenant_id,
          created_by_subject_id
        )
        VALUES (
          $1, $2, $3,
          COALESCE(
            NULLIF($4, '')::date,
            (NULLIF($5, '')::timestamptz AT TIME ZONE '${DEFAULT_TIMEZONE}')::date
          ),
          NULLIF($5, '')::timestamptz, $6::uuid, $7::uuid
        )
        RETURNING id, title, priority, status, due_date, due_at
      )
      SELECT id, title, priority, status,
        due_date::text AS due_date,
        CASE WHEN due_at IS NULL THEN NULL ELSE
          to_char(due_at AT TIME ZONE '${DEFAULT_TIMEZONE}', 'YYYY-MM-DD HH24:MI')
        END AS due_at_local,
        '${DEFAULT_TIMEZONE}' AS due_timezone
      FROM created;

  list_tasks:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      List tasks from the database. Pass a specific status to filter
      (pending, in_progress, done), or pass 'all' for recent tasks. Returns at
      most ${DEFAULT_PAGE_SIZE} records for user-friendly presentation.
    parameters:
      - name: status
        type: string
        description: "Filter by task status: pending, in_progress, done, or all"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      SELECT id, title, description, priority, status,
        due_date::text AS due_date,
        CASE WHEN due_at IS NULL THEN NULL ELSE
          to_char(due_at AT TIME ZONE '${DEFAULT_TIMEZONE}', 'YYYY-MM-DD HH24:MI')
        END AS due_at_local,
        '${DEFAULT_TIMEZONE}' AS due_timezone,
        created_at
      FROM tasks
      WHERE tenant_id = $2::uuid
        AND ($1 = 'all' OR status = $1)
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
        )
      ORDER BY created_at DESC
      LIMIT ${DEFAULT_PAGE_SIZE};

  update_task_status:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Update one task to pending, in_progress, or done. Returns no row when the
      ID does not exist; report that outcome instead of claiming success.
    parameters:
      - name: task_id
        type: integer
        description: ID of the task to update
      - name: status
        type: string
        description: "New status value: pending, in_progress, or done"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      UPDATE tasks
      SET status = $2
      WHERE id = $1 AND tenant_id = $3::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $3::uuid AND m.subject_id = $4::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING id, title, status;

  update_tasks_status:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Atomically update multiple explicitly selected task IDs to one supported
      status. Prefer this over repeated single-record calls. The user must have
      identified the exact IDs. Returns only records that existed.
    parameters:
      - name: task_ids
        type: string
        description: "Comma-separated task IDs, for example: 2,5,9"
      - name: status
        type: string
        description: "New status value: pending, in_progress, or done"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      UPDATE tasks
      SET status = $2
      FROM (
        SELECT DISTINCT trim(value)::bigint AS id
        FROM unnest(string_to_array($1, ',')) AS selected(value)
      ) AS requested
      WHERE tasks.id = requested.id AND tasks.tenant_id = $3::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $3::uuid AND m.subject_id = $4::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING tasks.id, tasks.title, tasks.status;

  delete_task:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Permanently delete one task by ID. Call only after the user explicitly
      confirms that exact task ID. Returns no row when the ID does not exist.
    parameters:
      - name: task_id
        type: integer
        description: ID of the task to delete
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      DELETE FROM tasks
      WHERE id = $1 AND tenant_id = $2::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING id, title;

  delete_tasks:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Atomically delete multiple tasks after the user explicitly confirms the
      exact IDs. Prefer this over repeated single-record calls. Returns only
      records that existed.
    parameters:
      - name: task_ids
        type: string
        description: "Comma-separated confirmed task IDs, for example: 2,5"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      DELETE FROM tasks
      USING (
        SELECT DISTINCT trim(value)::bigint AS id
        FROM unnest(string_to_array($1, ',')) AS selected(value)
      ) AS requested
      WHERE tasks.id = requested.id AND tasks.tenant_id = $2::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING tasks.id, tasks.title;

  # ── Notes Tools ───────────────────────────────────────────────────────────────

  create_note:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Create a new note. The note embedding is automatically generated by
      AlloyDB AI using the configured ${EMBEDDING_MODEL} model, enabling
      semantic search. Returns the created note metadata.
    parameters:
      - name: title
        type: string
        description: "Nonblank note title, for example: Access review ideas"
      - name: content
        type: string
        description: Full text content of the note
      - name: tags
        type: string
        description: Comma-separated tags, or empty string if none
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      INSERT INTO notes (
        title, content, tags, embedding, tenant_id, created_by_subject_id
      )
      VALUES (
        $1, $2, $3,
        google_ml.embedding('${EMBEDDING_MODEL}', $1 || ' ' || $2)::vector,
        $4::uuid, $5::uuid
      )
      RETURNING id, title, LEFT(content, 180) AS content_preview,
        CASE WHEN tags = '' THEN 'No tags' ELSE tags END AS tags;

  search_notes_semantic:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Search notes using AlloyDB AI semantic vector similarity. Use for
      conceptual queries, not tag filtering. Returns up to 5 relevant notes
      with a cosine relevance score.
    parameters:
      - name: query
        type: string
        description: Natural language search query
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      WITH ranked AS (
        SELECT id, title, content, tags, created_at,
          1 - (embedding <=> google_ml.embedding('${EMBEDDING_MODEL}', $1)::vector)
            AS relevance_score
        FROM notes
        WHERE embedding IS NOT NULL AND tenant_id = $2::uuid
          AND EXISTS (
            SELECT 1 FROM tenant_memberships m
            JOIN tenants t ON t.id = m.tenant_id
            WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
              AND t.status = 'active'
          )
      )
      SELECT id, title, content, tags, created_at,
        ROUND(relevance_score::numeric, 3) AS relevance_score
      FROM ranked
      WHERE relevance_score >= 0.50
      ORDER BY relevance_score DESC
      LIMIT 5;

  list_notes:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      List recent notes, optionally filtered by a tag. Pass an empty string for
      all tags. Returns at most ${DEFAULT_PAGE_SIZE} records.
    parameters:
      - name: tag
        type: string
        description: Tag to filter by, or empty string for all notes
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      SELECT id, title, content, tags, created_at
      FROM notes
      WHERE tenant_id = $2::uuid
        AND ($1 = '' OR tags ILIKE '%' || $1 || '%')
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
        )
      ORDER BY created_at DESC
      LIMIT ${DEFAULT_PAGE_SIZE};

  delete_note:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Permanently delete one note by ID. Call only after the user explicitly
      confirms that exact note ID. Returns no row when the ID does not exist.
    parameters:
      - name: note_id
        type: integer
        description: ID of the note to delete
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      DELETE FROM notes
      WHERE id = $1 AND tenant_id = $2::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING id, title;

  delete_notes:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Atomically delete multiple notes after the user explicitly confirms the
      exact IDs. Prefer this over repeated single-record calls. Returns only
      records that existed.
    parameters:
      - name: note_ids
        type: string
        description: "Comma-separated confirmed note IDs, for example: 2,5"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      DELETE FROM notes
      USING (
        SELECT DISTINCT trim(value)::bigint AS id
        FROM unnest(string_to_array($1, ',')) AS selected(value)
      ) AS requested
      WHERE notes.id = requested.id AND notes.tenant_id = $2::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING notes.id, notes.title;

  # ── Calendar Tools ────────────────────────────────────────────────────────────

  create_event:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Create a calendar event after relative dates have been resolved. Requires
      a nonblank title, ISO date, 24-hour start time, and positive duration.
    parameters:
      - name: title
        type: string
        description: Title of the event
      - name: date
        type: string
        description: "Resolved ISO event date, for example 2026-07-24"
      - name: time
        type: string
        description: "Start time in HH:MM 24-hour format, for example 16:00"
      - name: duration_minutes
        type: integer
        description: Duration of the event in minutes (default 60)
      - name: description
        type: string
        description: Optional description or agenda for the event
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      WITH created AS (
        INSERT INTO events (
          title, date, time, duration_minutes, description, tenant_id,
          created_by_subject_id
        )
        VALUES ($1, $2::date, $3::time, $4, $5, $6::uuid, $7::uuid)
        RETURNING id, title, date, time, duration_minutes
      )
      SELECT id, title, date::text AS date,
        to_char(time, 'HH24:MI') AS time, duration_minutes
      FROM created;

  list_events:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      List calendar events. Filter by a specific date (YYYY-MM-DD),
      or pass an empty string to list events chronologically. Returns at most
      ${DEFAULT_PAGE_SIZE} records.
    parameters:
      - name: date
        type: string
        description: Date to filter by in YYYY-MM-DD format, or empty string for all events
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      SELECT id, title, date::text AS date,
        to_char(time, 'HH24:MI') AS time,
        duration_minutes, description, created_at
      FROM events
      WHERE tenant_id = $2::uuid
        AND (NULLIF($1, '') IS NULL OR date = NULLIF($1, '')::date)
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
        )
      ORDER BY date ASC, time ASC
      LIMIT ${DEFAULT_PAGE_SIZE};

  delete_event:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Permanently delete one event by ID. Call only after the user explicitly
      confirms that exact event ID. Returns no row when the ID does not exist.
    parameters:
      - name: event_id
        type: integer
        description: ID of the event to delete
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      DELETE FROM events
      WHERE id = $1 AND tenant_id = $2::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING id, title;

  delete_events:
    kind: postgres-sql
    source: alloydb-productivity
    description: >
      Atomically delete multiple events after the user explicitly confirms the
      exact IDs. Prefer this over repeated single-record calls. Returns only
      records that existed.
    parameters:
      - name: event_ids
        type: string
        description: "Comma-separated confirmed event IDs, for example: 2,4"
      - name: tenant_id
        type: string
        description: Server-bound tenant UUID
      - name: subject_id
        type: string
        description: Server-bound subject UUID
    statement: >
      DELETE FROM events
      USING (
        SELECT DISTINCT trim(value)::bigint AS id
        FROM unnest(string_to_array($1, ',')) AS selected(value)
      ) AS requested
      WHERE events.id = requested.id AND events.tenant_id = $2::uuid
        AND EXISTS (
          SELECT 1 FROM tenant_memberships m
          JOIN tenants t ON t.id = m.tenant_id
          WHERE m.tenant_id = $2::uuid AND m.subject_id = $3::uuid
            AND t.status = 'active'
            AND m.role IN ('owner', 'admin', 'member')
        )
      RETURNING events.id, events.title;

toolsets:
  task-tools:
    - create_task
    - list_tasks
    - update_task_status
    - update_tasks_status
    - delete_task
    - delete_tasks

  notes-tools:
    - create_note
    - search_notes_semantic
    - list_notes
    - delete_note
    - delete_notes

  calendar-tools:
    - create_event
    - list_events
    - delete_event
    - delete_events
