name: Phase 5 - Billing-gated cloud validation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Approved Phase 5 action
        required: true
        type: choice
        options: [identity, provision, build, migrate, deploy, verify, promote, native, full]

permissions:
  contents: read
  id-token: write

concurrency:
  group: phase5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approved-cloud-change:
    environment: billing-enabled-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Materialize protected deployment configuration
        shell: bash
        env:
          PHASE5_ENV_FILE: ${{ secrets.PHASE5_ENV_FILE }}
        run: printf '%s' "${PHASE5_ENV_FILE}" > .env
      - name: Execute approved billing-gated action
        shell: bash
        run: setup/phase5.sh "${{ inputs.action }}"
