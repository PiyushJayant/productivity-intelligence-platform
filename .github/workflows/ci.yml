name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy main.py productivity_assistant setup/bigquery_setup.py setup/migrate.py
      - run: pytest
      - name: Dependency vulnerability scan
        # ADK 1.36.1 requires FastAPI <1, which requires Starlette <0.53.
        # Fixed Starlette releases are >=1.0.1; see SECURITY.md.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './setup ./cleanup'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - run: docker build -t productivity-assistant:test .
      - run: docker build -f Dockerfile.toolbox -t productivity-toolbox:test .
      - run: docker build -f Dockerfile.migrate -t productivity-migrate:test .
