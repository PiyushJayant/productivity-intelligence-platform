name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DATABASE: postgres
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: >-
          mypy main.py productivity_intelligence
          setup/bigquery_setup.py setup/migrate.py setup/init_env.py
          setup/lifecycle.py setup/evaluate_contracts.py setup/smoke_test.py
          setup/migration_runner.py setup/privacy_job.py
          setup/native_bigquery_setup.py setup/evaluate_cdc_trigger.py
          setup/identity_setup.py setup/load_test.py
          setup/dr_contract.py setup/observability_contract.py
          setup/observability_inventory.py setup/phase3_validate.py
      - run: pytest
      - name: Build offline Phase 3 delivery evidence
        run: python -m setup.phase3_validate --evidence phase3-evidence.json
      - name: Publish Phase 3 delivery evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase3-delivery-evidence
          path: phase3-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate deterministic agent evaluation manifest
        run: python setup/evaluate_contracts.py
      - name: Dependency vulnerability scan
        # ADK 1.36.1 requires FastAPI <1, which requires Starlette <0.53.
        # Fixed Starlette releases are >=1.0.1; see SECURITY.md.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './setup ./cleanup'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
      - name: Parse deployment YAML
        run: >-
          python -c "from pathlib import Path; import yaml;
          files=list(Path('.').glob('*.yaml'))+list(Path('.github/workflows').glob('*.yml'));
          [yaml.safe_load(p.read_text()) for p in files];
          print(f'validated {len(files)} YAML files')"
      - run: docker build -t productivity-intelligence:test .
      - run: docker build -f Dockerfile.toolbox -t productivity-toolbox:test .
      - run: docker build -f Dockerfile.migrate -t productivity-migrate:test .
