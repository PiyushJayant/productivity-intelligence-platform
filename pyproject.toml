[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=productivity_assistant --cov=main --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["mcp", "submission_assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
check_untyped_defs = true
